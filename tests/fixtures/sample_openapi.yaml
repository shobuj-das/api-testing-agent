openapi: 3.0.3
info:
  title: Booking API
  version: 1.0.0
servers:
  - url: https://api.example.test/v1
security:
  - bearerAuth: []
paths:
  /booking:
    parameters:
      - name: locale
        in: query
        schema:
          type: string
    post:
      summary: Create booking
      operationId: createBooking
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingid:
                    type: integer
  /booking/{booking_id}:
    get:
      summary: Get booking
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Found
        '404':
          description: Missing
components:
  schemas:
    Booking:
      type: object
      required: [firstname, lastname]
      properties:
        firstname:
          type: string
        lastname:
          type: string
        totalprice:
          type: integer
